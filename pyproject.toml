[project]
name = "ai-productivity-analysis"
version = "0.4.0"
description = "Detecting AI coding tool adoption on GitHub and its effect on developer output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "matplotlib>=3.8",
    # The committed models were pickled with scikit-learn 1.8; keep the minor
    # version so they load without warnings.
    "scikit-learn>=1.8,<1.9",
    "joblib>=1.4",
    "tabulate>=0.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
